name: Refresh Wikidata airline index

on:
  schedule:
    # 05:23 UTC on the first day of every month, independently of airports.
    - cron: '23 5 1 * *'
  workflow_dispatch:

# The workflow updates one automation branch and opens a reviewable PR. It does
# not write directly to main or deploy; merging the PR triggers deploy.yml.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-airline-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate local airline search index
        run: npm run update-airlines

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build production site
        run: npm run build

      - name: Check for airline data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/generated/airlines.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Wikidata airline search metadata is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Wikidata airline search metadata changed."
          fi

      - name: Open or refresh airline-data pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/monthly-wikidata-airlines"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git add src/data/generated/airlines.ts
          git commit -m "Update Wikidata airline search index"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update Wikidata airline search index" \
              --body "Monthly refresh of the local Wikidata-derived airline autocomplete snapshot. The updater, tests, lint, typecheck, and production build passed in GitHub Actions. This workflow is independent from airport-data maintenance and never accesses personal flight records. Merging this PR triggers the normal Pages deployment workflow."
          else
            echo "Updated existing pull request #$existing_pr."
          fi
